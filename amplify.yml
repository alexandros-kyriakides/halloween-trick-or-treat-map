version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        # npm install (not npm ci): npm ci rejects the dependencies that Amplify packages bundle
        - npm install --no-audit --no-fund --cache .npm --prefer-offline
    build:
      commands:
        # Deploys DynamoDB + AppSync and writes amplify_outputs.json (API URL + public key)
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - cp amplify_outputs.json public/amplify_outputs.json
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
