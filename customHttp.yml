# Security headers for every page served by Amplify Hosting.
# script/img/connect/frame/worker sources for Google Maps follow Google's allowlist CSP:
# https://developers.google.com/maps/documentation/javascript/content-security-policy
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com *.google.com https://*.ggpht.com *.googleusercontent.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://server.arcgisonline.com https://*.googleapis.com https://*.gstatic.com *.google.com *.googleusercontent.com; connect-src 'self' https://*.amazonaws.com https://*.googleapis.com *.google.com https://*.gstatic.com data: blob:; frame-src *.google.com; worker-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - key: X-Robots-Tag
        value: noindex, nofollow
      # Not no-referrer: OpenStreetMap's tile policy requires a Referer and may block tiles
      # without one. This value sends only the site origin cross-origin (never the #edit link).
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Content-Type-Options
        value: nosniff
      - key: Strict-Transport-Security
        value: max-age=31536000
  - pattern: /amplify_outputs.json
    headers:
      - key: Cache-Control
        value: no-cache
