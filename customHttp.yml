# Security headers for every page served by Amplify Hosting.
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - key: X-Robots-Tag
        value: noindex, nofollow
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: Strict-Transport-Security
        value: max-age=31536000
  - pattern: /amplify_outputs.json
    headers:
      - key: Cache-Control
        value: no-cache
